name: dsh-workstation

x-runtime: &runtime
  # Override with an immutable reference (tag@sha256:...) in the deployed
  # environment file. The value is recorded in every backup manifest.
  image: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.2}
  build: ./runtime
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - dsh-home:/dsh-home
    - workspace:/workspace
    - backups:/backup
    - runtime-launch:/run/dsh-runtime

services:
  gateway:
    image: ${WORKSTATION_GATEWAY_IMAGE:-dsh-workstation-gateway:0.1.0}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The Playwright CDP client creates scratch files when attaching.
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m"]
    environment:
      PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      GATEWAY_EDGE_IP: ${WORKSTATION_TRAEFIK_IP:?run deploy/public/init.sh}
      GATEWAY_ADDR: dsh-workstation-gateway-edge:8080
      GATEWAY_VERIFY_ADDR: dsh-workstation-gateway-edge:8081
      GATEWAY_PROVIDER_CONTROL_ADDR: 127.0.0.1:8081
      GATEWAY_BROWSER_UPSTREAM: http://127.0.0.1:8082
      # Non-input WebSockets go to Selkies over the workstation network.
      GATEWAY_BROWSER_DIRECT: http://dsh-workstation-chromium:3000
      WORKSTATION_PROVIDER: "1"
      WORKSTATION_BROWSER_MCP: ${WORKSTATION_BROWSER_MCP:-0}
      PROVIDER_IP: ${WORKSTATION_PROVIDER_IP:-172.30.241.3}
      PROVIDER_CONTROL_IP: 127.0.0.1
      PROVIDER_GATE_URL: http://127.0.0.1:8082
      GATE_ADDR: 127.0.0.1:8082
      GATE_CONTROL_SECRET: /run/secrets/gate_control
      BROWSER_TOOL_ORIGINS: ${BROWSER_TOOL_ORIGINS:-}
      # Read-only paths for the operations page (#32). Both volumes are mounted
      # read-only above; these names keep the Go code free of hard-coded paths.
      WORKSTATION_DSH_HOME: /dsh-home
      WORKSTATION_BACKUP_DIR: /backup
      # Backups and validation go through Runtime's private maintenance listener.
      WORKSTATION_MAINTENANCE_ADDR: dsh-workstation-runtime:8099
      WORKSTATION_MAINTENANCE_SECRET: /run/secrets/maintenance
      GATEWAY_IDLE: ${GATEWAY_IDLE:-}
      GATEWAY_ABSOLUTE: ${GATEWAY_ABSOLUTE:-}
      GATEWAY_MAX_SESSIONS: ${GATEWAY_MAX_SESSIONS:-}
      # Gateway reads these when the corresponding GATEWAY_* setting is absent.
      AUTH_IDLE: ${AUTH_IDLE:-}
      AUTH_ABSOLUTE: ${AUTH_ABSOLUTE:-}
      AUTH_MAX_SESSIONS: ${AUTH_MAX_SESSIONS:-}
    secrets: [auth_key, runtime_ca, maintenance, m0_master, m0_controller, m0_sentinel, m0_admin, browser_enroll, gate_control]
    volumes:
      - auth-data:/data
      - runtime-launch:/run/dsh-runtime:ro
      # Read-only view of versions and backups for the operations page.
      - dsh-home:/dsh-home:ro
      - backups:/backup:ro
      - provider-state:/state
      - cdp-socket:/run/workstation-cdp:ro
    networks:
      proxy:
        aliases: [dsh-workstation-gateway-edge]
      workstation:
        ipv4_address: ${WORKSTATION_PROVIDER_IP:-172.30.241.3}
        # Keep the endpoint in already-installed DSH Profiles.
        aliases: [provider]
    healthcheck:
      test: ["CMD", "workstation-gateway", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  gateway-admin:
    profiles: [maintenance]
    image: ${WORKSTATION_GATEWAY_IMAGE:-dsh-workstation-gateway:0.1.0}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: {driver: none}
    environment:
      PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
    secrets: [auth_key]
    volumes:
      - auth-data:/data
    command: ["bootstrap"]

  runtime:
    <<: *runtime
    restart: "on-failure:5"
    environment:
      DSH_INITIAL_VERSION: 0.2.2-rc.1
      # Derived by deploy/network.sh from WORKSTATION_SUBNET. The default keeps
      # an existing deployment working without an override.
      DSH_BIND_IP: ${WORKSTATION_RUNTIME_IP:-172.30.241.2}
      DSH_PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      WORKSTATION_INTERNAL_TLS: "1"
      WORKSTATION_BROWSER_MCP: ${WORKSTATION_BROWSER_MCP:-0}
      # Gateway uses this listener for inventory, backup and archive validation.
      MAINTENANCE_ADDR: 0.0.0.0:8099
      MAINTENANCE_SECRET: /run/secrets/maintenance
      WORKSTATION_RUNTIME_IMAGE: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.2}
      NODE_EXTRA_CA_CERTS: /run/secrets/runtime_ca
    secrets: [runtime_ca, runtime_cert, runtime_key, browser_enroll, maintenance]
    healthcheck:
      test: ["CMD", "dsh-runtime", "health"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 4m
    networks:
      workstation:
        ipv4_address: ${WORKSTATION_RUNTIME_IP:-172.30.241.2}
        aliases: [dsh-workstation-runtime]

  maintenance:
    <<: *runtime
    profiles: [maintenance]
    command: ["status"]
    environment:
      # Backups are taken here, so this must be present on maintenance too.
      WORKSTATION_RUNTIME_IMAGE: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.2}
    networks: [workstation]

  browser:
    # Chromium records the hostname in its persistent profile lock.
    hostname: dsh-workstation-chromium
    image: lscr.io/linuxserver/chromium:075b0b99-ls64@sha256:6d2a8da6a45d4083a7287211a619ca29fdb518ebea0ef562c27392ba2f6698d2
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PUID: "1000"
      PGID: "1000"
      SUBFOLDER: /browser/
      WORKSTATION_PROVIDER_IP: ${WORKSTATION_PROVIDER_IP:-172.30.241.3}
      CHROME_CLI: --user-data-dir=/config/chromium --remote-debugging-port=9222 --no-first-run
      SELKIES_MODE: websockets
      SELKIES_ENABLE_DUAL_MODE: "false"
      SELKIES_ALLOWED_ORIGINS: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      SELKIES_FRAME_ANCESTORS: "'self'"
      SELKIES_ENABLE_BASIC_AUTH: "false"
      FILE__SELKIES_MASTER_TOKEN: /run/secrets/m0_master
      SELKIES_ENABLE_COLLAB: "false"
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_ENABLE_CLIPBOARD: "false"
      SELKIES_GAMEPAD_ENABLED: "false"
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_WEBCAM_ENABLED: "false"
      SELKIES_COMMAND_ENABLED: "false"
    volumes:
      - browser-profile:/config
      - cdp-socket:/run/workstation-cdp
      - type: bind
        source: ./browser/cdp-relay
        target: /custom-services.d/workstation-cdp
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./browser/selkies-guard.sh
        target: /custom-cont-init.d/workstation-selkies
        read_only: true
        bind:
          create_host_path: false
    secrets: [m0_master]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl -sS --max-time 2 http://127.0.0.1:3000/browser/api/websockets)" = 'Gateway required' &&
          curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:3000/browser/api/health
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 1m
    networks:
      workstation:
        aliases: [dsh-workstation-chromium]

networks:
  proxy:
    name: ${WORKSTATION_PROXY_NETWORK:?run deploy/public/init.sh}
    external: true
  workstation:
    ipam:
      config:
        - subnet: ${WORKSTATION_SUBNET:-172.30.241.0/24}
          ip_range: ${WORKSTATION_IP_RANGE:-172.30.241.128/25}

secrets:
  auth_key:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/auth-key
  runtime_ca:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime-ca.pem
  runtime_cert:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime.pem
  runtime_key:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime-key.pem
  m0_admin:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/provider-admin
  m0_master:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-master
  m0_controller:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-controller
  m0_sentinel:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-sentinel
  browser_enroll:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/browser-enroll
  gate_control:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/gate-control
  maintenance:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/maintenance

volumes:
  # Keep the volume name so the renamed service opens the existing account and sessions.
  auth-data:
  dsh-home:
  workspace:
  backups:
  runtime-launch:
  browser-profile:
  provider-state:
  cdp-socket:
