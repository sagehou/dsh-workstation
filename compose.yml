name: dsh-workstation

x-runtime: &runtime
  # Override with an immutable reference (tag@sha256:...) in the deployed
  # environment file. The value is recorded in every backup manifest.
  image: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.1}
  build: ./runtime
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - dsh-home:/dsh-home
    - workspace:/workspace
    - backups:/backup
    - runtime-launch:/run/dsh-runtime

x-provider: &provider
  image: ${WORKSTATION_PROVIDER_IMAGE:-dsh-workstation-provider:0.2.0}
  build:
    context: .
    dockerfile: provider/Dockerfile
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  auth:
    image: ${WORKSTATION_AUTH_IMAGE:-dsh-workstation-auth:0.1.1}
    build: ./auth
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      AUTH_EDGE_IP: ${WORKSTATION_TRAEFIK_IP:?run deploy/public/init.sh}
      AUTH_ADDR: dsh-workstation-auth-edge:8080
      AUTH_VERIFY_ADDR: dsh-workstation-auth-edge:8081
      # Auth calls the provider's control listener. The address comes from the
      # derivation so a custom subnet moves it too.
      AUTH_PROVIDER_CONTROL_ADDR: ${BROWSER_PROVIDER_IP:-172.30.233.2}:8081
      # The browser data socket is proxied through the input gate (ADR-0005).
      AUTH_BROWSER_UPSTREAM: http://dsh-workstation-browser-gate:8082
      # Every other browser WebSocket bypasses the gate.
      AUTH_BROWSER_DIRECT: http://dsh-workstation-chromium:3000
      AUTH_IDLE: ${AUTH_IDLE:-30m}
      AUTH_ABSOLUTE: ${AUTH_ABSOLUTE:-12h}
      AUTH_MAX_SESSIONS: ${AUTH_MAX_SESSIONS:-8}
    secrets: [auth_key, m0_controller, m0_admin, runtime_ca]
    volumes:
      - auth-data:/data
      - runtime-launch:/run/dsh-runtime:ro
    networks:
      proxy:
        aliases: [dsh-workstation-auth-edge]
      workstation: {}
      browser: {}
    healthcheck:
      test: ["CMD", "workstation-auth", "health"]
      interval: 10s
      timeout: 4s
      retries: 5

  auth-admin:
    profiles: [maintenance]
    image: ${WORKSTATION_AUTH_IMAGE:-dsh-workstation-auth:0.1.1}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: {driver: none}
    environment:
      PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
    secrets: [auth_key]
    volumes:
      - auth-data:/data
    command: ["bootstrap"]

  runtime:
    <<: *runtime
    restart: "on-failure:5"
    environment:
      DSH_INITIAL_VERSION: 0.2.2-rc.1
      # Derived by deploy/network.sh from WORKSTATION_SUBNET. The default keeps
      # an existing deployment working without an override.
      DSH_BIND_IP: ${WORKSTATION_RUNTIME_IP:-172.30.241.2}
      DSH_PUBLIC_ORIGIN: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      WORKSTATION_INTERNAL_TLS: "1"
      WORKSTATION_BROWSER_MCP: "1"
      WORKSTATION_RUNTIME_IMAGE: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.1}
      NODE_EXTRA_CA_CERTS: /run/secrets/runtime_ca
    secrets: [runtime_ca, runtime_cert, runtime_key, browser_enroll]
    healthcheck:
      test: ["CMD", "dsh-runtime", "health"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 4m
    networks:
      workstation:
        ipv4_address: ${WORKSTATION_RUNTIME_IP:-172.30.241.2}
        aliases: [dsh-workstation-runtime]

  maintenance:
    <<: *runtime
    profiles: [maintenance]
    command: ["status"]
    environment:
      # Backups are taken here, so this must be present on maintenance too.
      WORKSTATION_RUNTIME_IMAGE: ${WORKSTATION_RUNTIME_IMAGE:-dsh-workstation-runtime:0.2.1}
    networks: [workstation]

  # The browser input gate (ADR-0005). Selkies evaluates input authority
  # against the live token table on every frame and installs a new table before
  # it announces the change, so a release sent after a revocation is dropped.
  # The gate releases held input *before* the Provider flips the table, and is
  # the only path from the operator's page to the Selkies data socket.
  browser-gate:
    image: ${WORKSTATION_GATE_IMAGE:-dsh-workstation-browser-gate:0.1.0}
    build:
      context: .
      dockerfile: browser-gate/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=8m"]
    environment:
      GATE_ADDR: ${BROWSER_GATE_IP:-172.30.233.4}:8082
      GATE_UPSTREAM: ws://dsh-workstation-chromium:3000/browser/api/websockets
      GATE_PATH: /browser/api/websockets
      GATE_CONTROL_SECRET: /run/secrets/gate_control
    secrets: [gate_control]
    depends_on:
      chromium: {condition: service_started, restart: true}
    networks:
      browser:
        ipv4_address: ${BROWSER_GATE_IP:-172.30.233.4}
        aliases: [dsh-workstation-browser-gate]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://' + process.env.GATE_ADDR + '/health', {signal: AbortSignal.timeout(2000)})
            .then(r => { if (r.status !== 204) process.exitCode = 1 })
            .catch(() => { process.exitCode = 1 })
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  chromium:
    # Chromium records the hostname in its persistent profile lock.
    hostname: dsh-workstation-chromium
    image: lscr.io/linuxserver/chromium:075b0b99-ls64@sha256:6d2a8da6a45d4083a7287211a619ca29fdb518ebea0ef562c27392ba2f6698d2
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PUID: "1000"
      PGID: "1000"
      SUBFOLDER: /browser/
      CHROME_CLI: --user-data-dir=/config/chromium --remote-debugging-port=9222 --no-first-run
      SELKIES_MODE: websockets
      SELKIES_ENABLE_DUAL_MODE: "false"
      SELKIES_ALLOWED_ORIGINS: https://${WORKSTATION_DOMAIN:?set WORKSTATION_DOMAIN}
      SELKIES_FRAME_ANCESTORS: "'self'"
      SELKIES_ENABLE_BASIC_AUTH: "false"
      FILE__SELKIES_MASTER_TOKEN: /run/secrets/m0_master
      SELKIES_ENABLE_COLLAB: "false"
      SELKIES_ENABLE_SHARING: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_ENABLE_CLIPBOARD: "false"
      SELKIES_GAMEPAD_ENABLED: "false"
      SELKIES_MICROPHONE_ENABLED: "false"
      SELKIES_WEBCAM_ENABLED: "false"
      SELKIES_COMMAND_ENABLED: "false"
    volumes:
      - browser-profile:/config
    secrets: [m0_master]
    networks:
      browser:
        aliases: [dsh-workstation-chromium]

  cdp-relay:
    <<: *provider
    restart: unless-stopped
    network_mode: service:chromium
    depends_on:
      chromium: {condition: service_started, restart: true}
    command: ["node", "cdp.mjs", "relay"]
    volumes:
      - cdp-socket:/run/workstation-cdp

  provider:
    <<: *provider
    restart: unless-stopped
    # Playwright creates a scratch directory even when attaching over CDP.
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m"]
    environment:
      WORKSTATION_PROVIDER: "1"
      # The provider binds these; they must equal the addresses Compose assigns
      # this container, or it fails with EADDRNOTAVAIL on a custom subnet.
      PROVIDER_IP: ${WORKSTATION_PROVIDER_IP:-172.30.241.3}
      PROVIDER_CONTROL_IP: ${BROWSER_PROVIDER_IP:-172.30.233.2}
      # Every input handover goes through the gate first (ADR-0005).
      PROVIDER_GATE_URL: http://dsh-workstation-browser-gate:8082
      BROWSER_TOOL_ORIGINS: ${BROWSER_TOOL_ORIGINS:-}
    volumes:
      - provider-state:/state
      - cdp-socket:/run/workstation-cdp:ro
    # Playwright attaches to Chromium; it never downloads or launches a browser.
    secrets: [m0_master, m0_controller, m0_sentinel, m0_admin, browser_enroll, gate_control]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://${BROWSER_PROVIDER_IP:-172.30.233.2}:8081/status', {
            headers: {Authorization: 'Bearer '+require('node:fs').readFileSync('/run/secrets/m0_admin','utf8')},
            signal: AbortSignal.timeout(2000)
          }).then(r => r.ok ? r.json() : {}).then(({state}) => {
            if (!['HUMAN','AGENT','HANDOVER'].includes(state)) process.exitCode = 1
          }).catch(() => { process.exitCode = 1 })
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    networks:
      # Block style, not {key: value}: `${...}` opens a nested YAML flow mapping
      # and the parser fails on the inner brace.
      workstation:
        ipv4_address: ${WORKSTATION_PROVIDER_IP:-172.30.241.3}
      browser:
        ipv4_address: ${BROWSER_PROVIDER_IP:-172.30.233.2}

networks:
  proxy:
    name: ${WORKSTATION_PROXY_NETWORK:?run deploy/public/init.sh}
    external: true
  workstation:
    ipam:
      config:
        - subnet: ${WORKSTATION_SUBNET:-172.30.241.0/24}
          ip_range: ${WORKSTATION_IP_RANGE:-172.30.241.128/25}
  browser:
    ipam:
      config:
        - subnet: ${BROWSER_SUBNET:-172.30.233.0/24}
          ip_range: ${BROWSER_IP_RANGE:-172.30.233.128/25}

secrets:
  auth_key:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/auth-key
  runtime_ca:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime-ca.pem
  runtime_cert:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime.pem
  runtime_key:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/runtime-key.pem
  m0_admin:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/provider-admin
  m0_master:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-master
  m0_controller:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-controller
  m0_sentinel:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/selkies-sentinel
  browser_enroll:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/browser-enroll
  gate_control:
    file: ${WORKSTATION_STATE:-./.workstation}/secrets/gate-control

volumes:
  auth-data:
  dsh-home:
  workspace:
  backups:
  runtime-launch:
  browser-profile:
  provider-state:
  cdp-socket:
