name: M1 private preview

on:
  workflow_dispatch:
  push:
    branches: ["m1/**"]
    paths: [runtime/**, deploy/**, compose.preview.yml, .github/workflows/m1-preview.yml]
  pull_request:
    paths: [runtime/**, deploy/**, compose.preview.yml, .github/workflows/m1-preview.yml]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # The gate rejects a Node the Runtime image does not ship, so the runner
      # must use the same Node as the image rather than the runner default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Confirm the runner Node matches the Runtime image
        run: test "$(node --version)" = "v24.22.3"
      - name: Unit-test the compatibility gate and backup manifests
        run: node --test "runtime/test/*.test.mjs"
      - name: Exercise the upgrade transaction without Docker
        run: bash runtime/test/e2e-upgrade.sh

  # Network derivation and the initializer are pure shell. They run in their own
  # job because the initializer refuses to run as root, while the Runtime tests
  # must run as root to exercise file ownership.
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test subnet derivation and the overlap preflight
        run: bash deploy/test/network.test.sh
      - name: Test repeatable initialization and PKI consistency
        run: |
          # useradd and chown need root; the runner user is not.
          sudo useradd --create-home --uid 2000 runner-init
          sudo install -d -o runner-init -g runner-init /tmp/init-work
          cp -a . /tmp/init-work/src
          sudo chown -R runner-init:runner-init /tmp/init-work/src
          sudo su runner-init -c 'cd /tmp/init-work/src && bash deploy/test/init.test.sh'

  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Bring up the private preview and exercise Runtime
        run: |
          set -o pipefail
          mkdir -p evidence
          bash deploy/ci-preview.sh 2>&1 | tee evidence/m1-preview.log
      - name: Pack the Runtime image for deploy without a build
        run: |
          set -o pipefail
          docker save dsh-workstation-runtime:preview | gzip -1 > evidence/dsh-workstation-runtime.tar.gz
          docker image inspect --format '{{.Id}}' dsh-workstation-runtime:preview > evidence/runtime-image-id
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1-private-preview
          path: evidence/

  # A separate job on a fresh runner. The preview job's teardown releases the
  # Compose project, volumes and networks, and reusing them in the same job
  # raced with the daemon and failed with "Address already in use".
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Drill the transactional upgrade and matched data restore
        run: |
          set -o pipefail
          mkdir -p evidence
          bash deploy/ci-upgrade.sh 2>&1 | tee evidence/upgrade-drill.log
      # The drill captures its own evidence into evidence/ before its EXIT
      # trap removes the volumes, so this only uploads what it produced.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m1-upgrade-drill
          path: evidence/
