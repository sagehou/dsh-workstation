name: Public Compose

on:
  workflow_dispatch:
  push:
    # main is included because a green pull request does not prove the merged
    # tree is green: a squash, a conflict resolution, or two individually
    # passing PRs can still interact badly. Without this, nothing ever runs on
    # the commit that is actually deployed.
    branches: ["public/**", "main"]
    paths:
      - gateway/**
      - runtime/**
      - provider/**
      - prototypes/m0/provider/*.mjs
      - prototypes/m0/provider/recorder.js
      - .dockerignore
      - browser-gate/**
      - compose.yml
      - deploy/public/**
      - deploy/test/**
      # The publish workflow consumes the resolver too. Without this its test
      # guard would never run on the change that breaks it -- which is how the
      # first real publish shipped an invalid tag.
      - .github/workflows/publish-images.yml
      - .github/workflows/public-compose.yml
  pull_request:
    paths:
      - gateway/**
      - runtime/**
      - provider/**
      - prototypes/m0/provider/*.mjs
      - prototypes/m0/provider/recorder.js
      - .dockerignore
      - browser-gate/**
      - compose.yml
      - deploy/public/**
      - deploy/test/**
      - .github/workflows/publish-images.yml
      - .github/workflows/public-compose.yml

permissions:
  contents: read

jobs:
  # The input gate is the component that makes exclusive handoff true, so its
  # tests run on their own before the image builds: a release-order regression
  # must fail here rather than only inside a full stack run.
  input-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Install the one gate dependency
        working-directory: browser-gate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the input gate against a fake Selkies
        working-directory: browser-gate
        run: node --test "test/*.test.mjs"

  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pinned.outputs.versions }}
      default: ${{ steps.pinned.outputs.default }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read the pinned Traefik matrix
        id: pinned
        run: |
          versions="$(bash deploy/public/traefik-image.sh --json)"
          printf 'versions=%s\n' "$versions" >> "$GITHUB_OUTPUT"
          printf 'default=%s\n' "$(bash deploy/public/traefik-image.sh --default)" >> "$GITHUB_OUTPUT"
          printf 'Traefik matrix: %s (default %s)\n' "$versions" "$(bash deploy/public/traefik-image.sh --default)"

  # Derivation and preflight are pure shell, so they run without Docker. This
  # covers the conflict, invalid-address and repeat-initialization cases that a
  # full stack cannot exercise without breaking the runner's own networking.
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test derivation and the overlap preflight
        run: bash deploy/test/network.test.sh
      - name: Test the published image resolver
        # Pure shell, no registry access: it checks that an unpublished or
        # malformed entry is refused rather than resolved to a floating tag.
        run: bash deploy/test/images.test.sh
      - name: Prove digest pull, upgrade and rollback on a real daemon
        # The resolver's contract is only half of #10; the other half is that a
        # `name:version@sha256:...` reference really pulls and runs, and that
        # switching digests upgrades and rolls back. A loopback registry makes
        # that testable without publishing to GHCR.
        run: bash deploy/test/images-registry.test.sh
      - name: Test repeatable initialization and PKI consistency
        # The initializer refuses to run as root, and the runner user is not
        # required to be non-root for the other jobs.
        run: |
          if [[ $(id -u) == 0 ]]; then
            echo 'this job must run as a non-root user to exercise init.sh' >&2
            exit 1
          fi
          bash deploy/test/init.test.sh

  public-compose:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        traefik: ${{ fromJSON(needs.matrix.outputs.versions) }}
        # Every Traefik version also runs once on a custom address plan. The
        # default leg proves the documented values; this leg proves nothing
        # silently depends on 172.30.x, which is the point of making the
        # subnets configurable.
        subnet:
          - default
          - custom
    name: public-compose (${{ matrix.traefik }}, ${{ matrix.subnet }} subnets)
    env:
      WORKSTATION_CI_TRAEFIK_VERSION: ${{ matrix.traefik }}
      WORKSTATION_CI_SUBNETS: ${{ matrix.subnet }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Resolve evidence paths and the address plan
        run: |
          suffix=""
          if [[ "$WORKSTATION_CI_TRAEFIK_VERSION" != "$(bash deploy/public/traefik-image.sh --default)" ]]; then
            suffix="-${WORKSTATION_CI_TRAEFIK_VERSION}"
          fi
          # Only the default Traefik on the default subnets keeps the unsuffixed
          # artifact names the deployment guide points at.
          if [[ "$WORKSTATION_CI_SUBNETS" != default ]]; then
            suffix="${suffix}-custom-subnets"
          fi
          printf 'EVIDENCE_SUFFIX=%s\n' "$suffix" >> "$GITHUB_ENV"
          printf 'Traefik under test: %s\n' "$(bash deploy/public/traefik-image.sh "$WORKSTATION_CI_TRAEFIK_VERSION")"
          if [[ "$WORKSTATION_CI_SUBNETS" == custom ]]; then
            # Deliberately outside 172.30.0.0/16. The derivation moves the
            # static addresses and the certificate SAN with the subnet.
            printf 'WORKSTATION_SUBNET=10.71.241.0/24\n' >> "$GITHUB_ENV"
            printf 'BROWSER_SUBNET=10.71.233.0/24\n' >> "$GITHUB_ENV"
            printf 'Address plan: custom (10.71.241.0/24, 10.71.233.0/24)\n'
            bash deploy/network.sh derive
          else
            printf 'Address plan: default\n'
          fi
      - name: Confirm the edge image is pinned by digest
        run: |
          version="$WORKSTATION_CI_TRAEFIK_VERSION"
          image="$(bash deploy/public/traefik-image.sh "$version")"
          pinned="$(bash deploy/public/traefik-image.sh --field digest "$version")"
          [[ $image == "traefik:${version}@sha256:"* ]] || {
            echo "$version is not pinned by digest in deploy/public/traefik-matrix.env" >&2
            exit 1
          }
          # Deployment uses tag@digest, so a moved upstream tag cannot change
          # what runs here. Record the tag's current digest for the audit trail
          # and warn when it has moved, without failing the compatibility run.
          observed="$(docker buildx imagetools inspect "traefik:$version" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" || observed=''
          printf 'tag digest: %s\npinned digest: %s\n' "${observed:-unavailable}" "$pinned" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n $observed && $observed != "$pinned" ]]; then
            printf '::warning::traefik:%s now resolves to %s; the run still uses the pinned %s\n' "$version" "$observed" "$pinned"
          fi
          echo "Pinned edge image for $version: $image"
      - name: Resolve pinned dependencies and race-test the Go gateway
        run: |
          mkdir -p evidence/source/gateway evidence/source/provider
          docker run --rm \
            --mount "type=bind,source=$PWD/gateway,target=/input,readonly" \
            --mount "type=bind,source=$PWD/evidence/source/gateway,target=/output" \
            -w /tmp golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0 \
            bash -euc 'mkdir /tmp/src; cp -a /input/. /tmp/src; cd /tmp/src; gofmt -w *.go; go mod tidy; cp *.go go.mod go.sum /output; go test -race -v ./...'
          docker run --rm \
            --mount "type=bind,source=$PWD/provider/package.json,target=/tmp/package.json,readonly" \
            --mount "type=bind,source=$PWD/evidence/source/provider,target=/output" \
            -w /tmp node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54 \
            sh -ec 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund; cp package-lock.json /output'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-compose-source-locks${{ env.EVIDENCE_SUFFIX }}
          path: evidence/source/
      - name: Verify the Compose stack with HTTPS through Traefik
        run: |
          set -o pipefail
          bash deploy/public/ci.sh 2>&1 | tee "evidence/public-compose${EVIDENCE_SUFFIX}.log"
      - name: Package the four workstation images
        run: |
          set -euo pipefail
          # The tags come from the same resolver a deployment uses, so the
          # archive cannot drift from the naming scheme.
          mapfile -t images < <(bash deploy/public/images.sh --local | sed -n 's/^[^=]*=//p')
          (( ${#images[@]} == 4 )) || { echo 'expected four images' >&2; exit 1; }
          # This archive is audit evidence, not a distribution channel: releases
          # are pulled from GHCR by digest (see deploy/public/images.env).
          docker save "${images[@]}" |
            gzip -1 > "evidence/workstation-images-linux-amd64${EVIDENCE_SUFFIX}.tar.gz"
          (cd evidence && sha256sum "workstation-images-linux-amd64${EVIDENCE_SUFFIX}.tar.gz" \
            > "workstation-images-linux-amd64${EVIDENCE_SUFFIX}.sha256")
          git rev-parse HEAD > evidence/source-commit
          bash deploy/public/traefik-image.sh "$WORKSTATION_CI_TRAEFIK_VERSION" > "evidence/traefik-image${EVIDENCE_SUFFIX}"
          docker image inspect --format '{{index .RepoTags 0}} {{.Id}}' "${images[@]}" > evidence/image-ids
          # Record what the resolver would deploy, so the artifact says which
          # digests these image IDs belong to.
          bash deploy/public/images.sh --local > evidence/image-tags
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-compose-linux-amd64${{ env.EVIDENCE_SUFFIX }}
          path: |
            evidence/*
            !evidence/source/

  # Every leg above builds the images from this checkout, which proves the source
  # builds but says nothing about the artifacts a deployment actually runs. This
  # job uses the released Compose file, probes and digests from the same commit.
  # It runs the published stack with no workstation build or registry login.
  release-compose:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read the published deployment commit
        id: release
        run: |
          read -r ref < deploy/public/release-commit
          [[ $ref =~ ^[a-f0-9]{40}$ ]]
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.ref }}
          path: released
      - name: Refuse to run against an unpublished image
        run: |
          set -euo pipefail
          bash released/deploy/public/images.sh
      - name: Prove the pull is anonymous by construction
        run: |
          set -euo pipefail
          # The packages are public, so the pull must work with no credential.
          # Do not *inspect* the runner's Docker config and hope it is empty --
          # GitHub's runner writes `{"auths": {}}`, and a check that greps for
          # the key fails on a config that authenticates nothing. Build a config
          # that cannot hold a credential instead: a fresh empty directory.
          anon="$(mktemp -d)"
          chmod 0700 "$anon"
          printf '{}\n' > "$anon/config.json"
          echo "DOCKER_CONFIG=$anon" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$anon" docker info --format '{{.ServerVersion}}' >/dev/null
          if DOCKER_CONFIG="$anon" sh -c 'test -s "$DOCKER_CONFIG/config.json" && grep -q auths "$DOCKER_CONFIG/config.json"'; then
            echo 'a credential leaked into the isolated Docker config' >&2
            exit 1
          fi
          # `docker pull` stores credentials it used; asserting the file stays a
          # bare `{}` after the run is the check that nothing was authorised.
          echo 'Using an isolated, credential-free Docker config for every pull.'
      - name: Run the whole stack from the published digests
        run: |
          set -o pipefail
          WORKSTATION_CI_IMAGE_MODE=release bash released/deploy/public/ci.sh 2>&1 |
            tee evidence-release.log
      - name: Assert the pull used no credential
        run: |
          set -euo pipefail
          # If a credential had been used, Docker would have written it back to
          # the isolated config. A bare `{}` after a full pull and stack start is
          # what makes "anonymous" a measured fact rather than a claim.
          content="$(cat "$DOCKER_CONFIG/config.json")"
          if [[ $content != '{}' && $content != *'"auths": {}'* ]]; then
            echo "the Docker config gained content during the pull: $content" >&2
            exit 1
          fi
          echo "The pull left the Docker config empty: $content"
          echo 'Anonymous pull confirmed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the deployed references
        if: always()
        run: |
          # The log is evidence; .env.public is not uploaded because it holds
          # host configuration. The references that ran are what matters.
          git -C released rev-parse HEAD > evidence-release-commit
          bash released/deploy/public/images.sh > evidence-release-references
          cat evidence-release-references
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-compose-release
          path: |
            evidence-release.log
            evidence-release-commit
            evidence-release-references

  # The core shape (#26) is verified once, not per Traefik version and subnet
  # plan: what it asserts is "the browser stack is absent and Gateway reports it",
  # none of which varies with the edge. Running it across the matrix would
  # multiply the cost without adding a distinct claim.
  core-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Drop the deployment state a stale run may have left
        run: sudo rm -rf .workstation .env.public
      - name: Run the core deployment
        run: bash deploy/public/ci-core.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-shape-log
          path: |
            core-shape.log

  matrix-summary:
    needs: [input-gate, matrix, public-compose, release-compose, core-shape]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Record the compatibility matrix outcome
        env:
          VERSIONS: ${{ needs.matrix.outputs.versions }}
          RESULT: ${{ needs.public-compose.result }}
          GATE: ${{ needs.input-gate.result }}
          RELEASE: ${{ needs.release-compose.result }}
          RELEASE_REF: ${{ needs.release-compose.outputs.ref }}
          CORE: ${{ needs.core-shape.result }}
        run: |
          {
            printf '## Traefik compatibility matrix\n\n'
            printf 'Input gate tests reported `%s`. Full stack jobs reported `%s`.\n\n' "$GATE" "$RESULT"
            printf '| Traefik | Pinned digest | Address plan | Scope |\n| --- | --- | --- | --- |\n'
            node --input-type=module -e '
              import { execFileSync } from "node:child_process"
              for (const version of JSON.parse(process.env.VERSIONS)) {
                const digest = execFileSync("bash", ["deploy/public/traefik-image.sh", "--field", "digest", version], { encoding: "utf8" }).trim()
                for (const plan of ["default", "custom"]) {
                  const note = plan === "custom" ? "10.71.241.0/24 + 10.71.233.0/24" : "172.30.241.0/24 + 172.30.233.0/24"
                  console.log(`| \`${version}\` | \`${digest}\` | ${plan} (${note}) | \`deploy/public/ci.sh\` + \`deploy/public/edge-probe.mjs\` |`)
                }
              }
            '
            printf '\nEvery leg runs the same Compose stack, edge probe and authenticated browser checks. Two things vary: the pinned Traefik image, and whether the subnets are the defaults or a custom plan.\n'
            printf '\n## Published digests\n\n'
            if [[ "$RELEASE" == success ]]; then
              printf 'The `release-compose` job pulled the published digests anonymously and passed the probes from deployment commit `%s`. See the `public-compose-release` artifact for the exact references.\n' "$RELEASE_REF"
            else
              printf 'The `release-compose` job reported `%s` for deployment commit `%s`. See its logs and references in the artifact.\n' "$RELEASE" "$RELEASE_REF"
            fi
            printf '\n## Core deployment shape\n\n'
            if [[ "$CORE" == success ]]; then
              printf '`deploy/public/compose.core.yml` started `gateway` and `runtime` only, left the browser Bundle uninstalled, and answered `/browser/` with a `503` from the core path. No browser service ran.\n'
            else
              printf 'The `core-shape` leg reported `%s`. The core deployment has **not** been shown to work.\n' "$CORE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when any pinned version failed
        if: needs.public-compose.result != 'success' || needs.input-gate.result != 'success' || needs.release-compose.result != 'success' || needs.core-shape.result != 'success'
        run: |
          echo "The input gate, a pinned Traefik version, the published digests, or the core shape failed; see the jobs." >&2
          exit 1
