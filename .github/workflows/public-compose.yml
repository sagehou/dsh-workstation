name: Public Compose

on:
  workflow_dispatch:
  push:
    branches: ["public/**"]
    paths:
      - auth/**
      - runtime/**
      - provider/**
      - prototypes/m0/provider/server.mjs
      - compose.yml
      - deploy/public/**
      - .github/workflows/public-compose.yml
  pull_request:
    paths:
      - auth/**
      - runtime/**
      - provider/**
      - prototypes/m0/provider/server.mjs
      - compose.yml
      - deploy/public/**
      - .github/workflows/public-compose.yml

permissions:
  contents: read

jobs:
  public-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Resolve pinned dependencies and race-test the Go gateway
        run: |
          mkdir -p evidence/source/auth evidence/source/provider
          docker run --rm \
            --mount "type=bind,source=$PWD/auth,target=/input,readonly" \
            --mount "type=bind,source=$PWD/evidence/source/auth,target=/output" \
            -w /tmp golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0 \
            bash -euc 'mkdir /tmp/src; cp -a /input/. /tmp/src; cd /tmp/src; gofmt -w *.go; go mod tidy; cp *.go go.mod go.sum /output; go test -race -v ./...'
          docker run --rm \
            --mount "type=bind,source=$PWD/provider/package.json,target=/tmp/package.json,readonly" \
            --mount "type=bind,source=$PWD/evidence/source/provider,target=/output" \
            -w /tmp node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54 \
            sh -ec 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund; cp package-lock.json /output'
      - name: Verify the Compose stack with HTTPS through Traefik
        run: |
          set -o pipefail
          bash deploy/public/ci.sh 2>&1 | tee evidence/public-compose.log
      - name: Package the three workstation images
        run: |
          docker save dsh-workstation-runtime:0.2.0 dsh-workstation-auth:0.1.0 dsh-workstation-provider:0.1.0 \
            | gzip -1 > evidence/workstation-images-linux-amd64.tar.gz
          (cd evidence && sha256sum workstation-images-linux-amd64.tar.gz > workstation-images-linux-amd64.sha256)
          git rev-parse HEAD > evidence/source-commit
          docker image inspect --format '{{index .RepoTags 0}} {{.Id}}' \
            dsh-workstation-runtime:0.2.0 dsh-workstation-auth:0.1.0 dsh-workstation-provider:0.1.0 > evidence/image-ids
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-compose-linux-amd64
          path: evidence/
