name: M0 remote experiments

on:
  # M0 is finished and its `m0/issue-1` branch is gone, so a branch push can
  # never fire this again. It stays manual so the M0 evidence remains
  # reproducible without putting prototype jobs on every main run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    if: "github.event.head_commit.message != 'test: run approved M0 native PTY build'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate A runtime and persistence
        run: |
          set -o pipefail
          mkdir -p evidence
          { docker version; docker compose version; bash prototypes/m0/runtime/run.sh; } 2>&1 | tee evidence/runtime.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-runtime
          path: evidence/runtime.log
  browser:
    if: "github.event.head_commit.message != 'test: run approved M0 native PTY build'"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate B shared Chromium
        run: |
          set -o pipefail
          mkdir -p evidence
          { docker version; docker compose version; bash prototypes/m0/browser/run.sh; } 2>&1 | tee evidence/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-browser
          path: evidence/browser.log
  selkies-input:
    if: "github.event.head_commit.message != 'test: run approved M0 native PTY build'"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate C Selkies input boundary
        run: |
          set -o pipefail
          mkdir -p evidence
          bash prototypes/m0/browser/run.sh --exclusive 2>&1 | tee evidence/selkies-input.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-selkies-input
          path: evidence/selkies-input.log
  sidebar:
    if: "github.event.head_commit.message != 'test: run approved M0 native PTY build'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate D Sidebar client plugin
        run: |
          set -o pipefail
          mkdir -p evidence
          bash prototypes/m0/browser/sidebar/run.sh 2>&1 | tee evidence/sidebar.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-sidebar
          path: evidence/sidebar.log
  native:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'test: run approved M0 native PTY build'"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run the approved native build once
        run: |
          set -o pipefail
          mkdir -p evidence
          docker compose -f prototypes/m0/runtime/compose.yml run --build --rm --no-deps -T runtime bash /m0/native.sh 2>&1 | tee evidence/native.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-native
          path: evidence/native.log
