name: M0 remote experiments

on:
  push:
    branches: [m0/issue-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate A runtime and persistence
        run: |
          set -o pipefail
          mkdir -p evidence
          { docker version; docker compose version; bash prototypes/m0/runtime/run.sh; } 2>&1 | tee evidence/runtime.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-runtime
          path: evidence/runtime.log
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate B shared Chromium
        run: |
          set -o pipefail
          mkdir -p evidence
          { docker version; docker compose version; bash prototypes/m0/browser/run.sh; } 2>&1 | tee evidence/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-browser
          path: evidence/browser.log
