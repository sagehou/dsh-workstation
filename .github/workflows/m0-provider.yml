name: M0 Browser Provider

on:
  push:
    branches: [m0/issue-1]
    paths: [.github/workflows/m0-provider.yml, 'prototypes/m0/provider/**']

permissions:
  contents: read

jobs:
  browser-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Gate C independent lease provider
        run: |
          set -o pipefail
          mkdir -p evidence
          { docker version; docker compose version; node --version; bash prototypes/m0/provider/run.sh; } 2>&1 | tee evidence/browser-provider.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-browser-provider
          path: evidence/browser-provider.log
