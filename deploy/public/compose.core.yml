# Core deployment: DSH and Gateway only, without the shared browser.
#
# Use this when the workstation only needs DSH and Gateway. The browser
# container and the Gateway browser workers are both disabled. See issue #26.
#
#   full:  docker compose -f compose.yml --env-file .env.public up -d
#   core:  docker compose -f compose.yml -f deploy/public/compose.core.yml \
#            --env-file .env.public up -d
#
services:
  browser:
    profiles: ["browser"]

  # Without this, the Runtime still installs the Workstation browser Bundle into
  # the Web Profile (runtime/dsh-runtime:191) even though nothing can serve it.
  # The Bundle pins DSH 0.2.2-rc.1 and would fail an otherwise valid upgrade, so
  # leaving it off is the difference between "core" and "full minus containers".
  runtime:
    environment:
      WORKSTATION_BROWSER_MCP: "0"

  gateway:
    environment:
      # Disable both browser workers and the Gateway browser proxy.
      GATEWAY_BROWSER_ENABLED: "0"

  # compose.ci.yml adds `fixture` for the full-stack legs. It belongs to the
  # browser side of the stack, so a core run must not start it either.
  fixture:
    profiles: ["browser"]
